<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Deskhub</title>
    <link rel="stylesheet" href="styles/app.css" />
  </head>
  <body data-page="login">
    <div class="top-toolbar">
      <button type="button" class="btn btn--ghost" data-theme-toggle>Dark</button>
    </div>
    <main class="shell shell--narrow">
      <h1>Deskhub</h1>
      <p class="lede">Sign in to manage support tickets.</p>
      <form id="login-form" class="card stack">
        <label class="field">
          <span>Email</span>
          <input id="login-email" type="email" autocomplete="username" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn--primary btn--block">Sign in</button>
        <p id="login-hint" class="hint"></p>
      </form>
    </main>
    <script type="module" src="../src/main.js"></script>
  </body>
</html>
